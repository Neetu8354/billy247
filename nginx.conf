server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-style fallback: any path without a matching file serves index.html
    # (fixes /faqs/, /contact-us/, /privacy-policy/ 404s on the static deploy)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
